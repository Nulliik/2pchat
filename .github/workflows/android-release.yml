name: Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: 2pchatGO/android/core-go/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 26.3.11579264
        run: |
          echo "y" | sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Make Gradle executable
        run: chmod +x 2pchatGO/android/gradlew

      - name: Build APK with Gradle
        run: |
          cd 2pchatGO/android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="0.0.8.1"
          fi
          cp 2pchatGO/android/app/build/outputs/apk/debug/app-debug.apk "2pchat-${VERSION}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2pchat-apk
          path: 2pchat-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 2pchat-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
