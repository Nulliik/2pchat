name: go-verify

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2pchatGO/android/core-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 2pchatGO/android/core-go/go.mod
          cache-dependency-path: 2pchatGO/android/core-go/go.sum

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./... -timeout 10m

      - name: Race detector
        run: go test -race ./... -timeout 20m

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Fuzz smoke (declaration parser)
        run: go test ./pkg/protocol -run '^$' -fuzz FuzzDeclaration -fuzztime 60s -parallel 2

  python-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 2pchatGO/android/core-go/go.mod
          cache-dependency-path: 2pchatGO/android/core-go/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify workflow security (anti-shell-injection)
        run: python3 scripts/verify-workflows.py

      - name: Python venv + deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -r messenger/requirements.txt

      - name: Expose venv + repo root for interop tests
        run: |
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "P2PCHAT_PYTHON_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Go↔Python interop (baseline + negotiated)
        working-directory: 2pchatGO/android/core-go
        run: go test ./pkg/session -run 'TestPythonGo.*Interop' -v -timeout 10m

      - name: Python suite
        run: .venv/bin/python -m pytest -q

  android-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: "Unit tests + lint (без NDK: быстро и достаточно для гейта)"
        working-directory: 2pchatGO/android
        run: ./gradlew testDebugUnitTest lintDebug --console=plain

      - name: "Focus: protocol compatibility"
        working-directory: 2pchatGO/android
        run: ./gradlew testDebugUnitTest --tests "com.example.twopchat.protocol.ProtocolCompatibilityTest" --console=plain
